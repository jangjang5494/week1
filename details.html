<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세 정보 입력 - 내집구독</title>
    <link href="/style.css" rel="stylesheet">
    <style>
        .details-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .details-container h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }
        .details-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group label {
            font-weight: bold;
        }
        .help-link {
            font-size: 0.8rem;
            color: var(--primary-color);
            text-decoration: underline;
            cursor: pointer;
        }
        .form-group input, .form-group select {
            padding: 0.8rem;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        .helper-text {
            font-size: 0.75rem;
            color: #666;
            margin-top: -0.2rem;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary-color);
            cursor: pointer;
        }
        .form-row {
            display: flex;
            gap: 1rem;
        }
        .form-row .form-group {
            flex: 1;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: var(--card-bg);
            margin: 15% auto;
            padding: 2rem;
            border-radius: 15px;
            width: 80%;
            max-width: 500px;
            position: relative;
            color: var(--text-color);
        }
        .close {
            position: absolute;
            right: 1.5rem;
            top: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-content h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
        }
        .modal-content ul {
            padding-left: 1.2rem;
            list-style-type: disc;
        }
        .modal-content li {
            margin-bottom: 0.8rem;
        }
    </style>
</head>
<body data-theme="light">
    <header>
        <nav>
            <div class="logo">내집구독</div>
            <div class="nav-controls">
                <button class="theme-toggle" onclick="toggleTheme()">다크 모드</button>
            </div>
        </nav>
    </header>

    <main style="padding-top: 100px;">
        <div class="details-container">
            <a href="index.html" class="back-btn">← 돌아가기</a>
            <h1>상세 자격 확인</h1>
            <p style="text-align: center; margin-bottom: 2rem;">정확한 분석을 위해 상세한 정보를 입력해주세요.</p>
            
            <form class="details-form" onsubmit="handleSubmit(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="age">나이 (만)</label>
                        <input type="number" id="age" placeholder="예: 28" required>
                    </div>
                    <div class="form-group">
                        <label for="marital">혼인 상태</label>
                        <select id="marital" required>
                            <option value="single">미혼</option>
                            <option value="married">기혼</option>
                            <option value="newlywed">예비 신혼부부</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="label-row">
                        <label for="income">월평균 소득 (세전)</label>
                        <span class="help-link" onclick="openModal('income')">확인 방법</span>
                    </div>
                    <select id="income" required>
                        <option value="">소득 구간 선택</option>
                        <option value="1">250만원 이하</option>
                        <option value="2">250만원 ~ 350만원</option>
                        <option value="3">350만원 ~ 450만원</option>
                        <option value="4">450만원 ~ 550만원</option>
                        <option value="5">550만원 이상</option>
                    </select>
                    <span class="helper-text">건강보험 보수월액 또는 세전 급여 기준</span>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="assets">총 자산 (부채 제외)</label>
                        <span class="help-link" onclick="openModal('assets')">확인 방법</span>
                    </div>
                    <select id="assets" required>
                        <option value="">자산 규모 선택</option>
                        <option value="1">5,000만원 이하</option>
                        <option value="2">5,000만원 ~ 1억원</option>
                        <option value="3">1억원 ~ 2억원</option>
                        <option value="4">2억원 ~ 3.6억원</option>
                        <option value="5">3.6억원 이상</option>
                    </select>
                    <span class="helper-text">부동산, 금융자산, 일반자산 합산 금액</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <div class="label-row">
                            <label for="car">자동차 가액</label>
                            <span class="help-link" onclick="openModal('car')">확인</span>
                        </div>
                        <select id="car" required>
                            <option value="none">없음</option>
                            <option value="under">3,700만원 이하</option>
                            <option value="over">3,700만원 초과</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="homeless">무주택 기간</label>
                        <select id="homeless" required>
                            <option value="1">1년 미만</option>
                            <option value="2">1년 ~ 3년</option>
                            <option value="3">3년 ~ 5년</option>
                            <option value="4">5년 이상</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="subscription">청약통장 납입 횟수</label>
                    <select id="subscription" required>
                        <option value="1">12회 미만</option>
                        <option value="2">12회 ~ 24회</option>
                        <option value="3">24회 ~ 60회</option>
                        <option value="4">60회 이상</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="region">관심 자치구 (최대 3개)</label>
                    <select id="region" required>
                        <option value="all">서울 전체</option>
                        <option value="gangnam">강남/서초/송파</option>
                        <option value="mapo">마포/용산/성동</option>
                        <option value="etc">그 외 지역</option>
                    </select>
                </div>

                <button type="submit" class="hero-content button" style="width: 100%; padding: 1rem; background-color: var(--secondary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1rem; margin-top: 1rem;">AI 맞춤 분석 결과 보기</button>
            </form>
        </div>
    </main>

    <!-- Modal -->
    <div id="helpModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const themeToggle = document.querySelector('.theme-toggle');
            if (themeToggle) {
                themeToggle.textContent = newTheme === 'light' ? '다크 모드' : '라이트 모드';
            }
        }

        // Apply saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        const themeToggle = document.querySelector('.theme-toggle');
        if (themeToggle) {
            themeToggle.textContent = savedTheme === 'light' ? '다크 모드' : '라이트 모드';
        }

        const modalContents = {
            income: {
                title: "월평균 소득 확인 방법",
                items: [
                    "<b>직장인:</b> <a href='https://www.nhis.or.kr' target='_blank'>국민건강보험공단</a> 사이트 접속 > 민원여기요 > 개인민원 > 보험료 조회 > '직장보험료 조회'에서 확인 가능합니다.",
                    "<b>사업자/프리랜서:</b> <a href='https://www.hometax.go.kr' target='_blank'>홈택스</a> > 국세증명 > '소득금액증명' 발급 후 연간 소득을 12로 나누어 확인하세요.",
                    "보통 최근 1년간의 세전 소득을 기준으로 합니다."
                ]
            },
            assets: {
                title: "총 자산 확인 방법",
                items: [
                    "부동산(공시가격), 예적금, 주식, 보험 해약환급금을 모두 더한 금액입니다.",
                    "<b>부동산:</b> <a href='https://www.realtyprice.kr' target='_blank'>부동산공시가격 알리미</a>에서 확인 가능합니다.",
                    "<b>금융자산:</b> 토스, 카카오뱅크 등 뱅킹 앱의 '내 자산' 기능을 활용하면 가장 빠릅니다.",
                    "부채(대출 등)는 자산에서 차감되지 않는 경우가 많으니 공고문을 꼭 확인하세요."
                ]
            },
            car: {
                title: "자동차 가액 확인 방법",
                items: [
                    "취득 가격이 아닌 현재 시세(감가상각 반영) 기준입니다.",
                    "<b>보험개발원:</b> <a href='https://www.kidi.or.kr' target='_blank'>보험개발원</a> 사이트 > 알림광장 > '차량기준가액 조회'에서 차량번호로 조회 가능합니다.",
                    "<b>홈택스:</b> 승용차 가액조회 메뉴에서도 확인 가능합니다."
                ]
            }
        };

        function openModal(type) {
            const content = modalContents[type];
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2>${content.title}</h2>
                <ul>
                    ${content.items.map(item => `<li>${item}</li>`).join('')}
                </ul>
                <button onclick="closeModal()" style="width:100%; margin-top:1rem; padding:0.8rem; border:none; background:var(--primary-color); color:white; border-radius:5px; cursor:pointer;">확인</button>
            `;
            document.getElementById('helpModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('helpModal').style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('helpModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            alert('입력하신 정보를 바탕으로 상세 분석을 완료했습니다! 맞춤 공고가 뜨면 바로 알려드릴게요.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
