<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 · 내집구독</title>
<link rel="icon" href="./assets/og-image.png">
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .card{background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.1);}
  .logo{text-align:center;margin-bottom:1.75rem;font-size:1.4rem;font-weight:900;color:#111;}
  .logo em{color:#4f46e5;font-style:normal;}
  h2{font-size:1.2rem;font-weight:800;color:#111;margin-bottom:.3rem;}
  p.sub{font-size:.85rem;color:#6b7280;margin-bottom:1.5rem;}
  .fg{margin-bottom:1rem;}
  .fg label{display:block;font-size:.83rem;font-weight:600;color:#111;margin-bottom:.3rem;}
  .fg input{width:100%;padding:.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;background:#f9fafb;font-size:.93rem;color:#111;transition:border-color .2s;}
  .fg input:focus{outline:none;border-color:#4f46e5;}
  .btn{width:100%;padding:.85rem;border:none;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:.25rem;}
  .btn:hover{opacity:.88;}
  .btn:disabled{opacity:.55;cursor:default;}
  .msg-error{font-size:.82rem;color:#dc2626;background:#fef2f2;border-radius:8px;padding:.5rem .75rem;margin-bottom:.75rem;display:none;}
  .msg-error.show{display:block;}
  .msg-success{font-size:.82rem;color:#15803d;background:#f0fdf4;border-radius:8px;padding:.5rem .75rem;margin-bottom:.75rem;display:none;}
  .msg-success.show{display:block;}
  .back{text-align:center;margin-top:1.25rem;font-size:.83rem;color:#6b7280;}
  .back a{color:#4f46e5;font-weight:600;text-decoration:none;}
  .invalid{text-align:center;padding:2rem 0;}
  .invalid p{color:#6b7280;font-size:.9rem;margin-top:.5rem;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">내집<em>구독</em></div>

  <!-- 유효한 링크일 때 -->
  <div id="reset-form">
    <h2>새 비밀번호 설정</h2>
    <p class="sub">사용할 새 비밀번호를 입력해주세요.</p>
    <div class="msg-error" id="err"></div>
    <div class="msg-success" id="suc"></div>
    <div class="fg">
      <label>새 비밀번호</label>
      <input type="password" id="pw1" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password">
    </div>
    <div class="fg">
      <label>비밀번호 확인</label>
      <input type="password" id="pw2" placeholder="비밀번호 재입력" autocomplete="new-password">
    </div>
    <button class="btn" id="submit-btn" onclick="doReset()">비밀번호 변경</button>
  </div>

  <!-- 링크 만료/오류 -->
  <div id="invalid-form" style="display:none;" class="invalid">
    <h2>링크가 만료되었습니다</h2>
    <p>비밀번호 재설정 링크가 유효하지 않거나 만료되었습니다.<br>다시 요청해주세요.</p>
  </div>

  <div class="back"><a href="./index.html">← 홈으로 돌아가기</a></div>
</div>

<script>
const SB_URL = 'https://ajgurlfgifvicvxsxzqh.supabase.co';
const SB_KEY = 'sb_publishable_VWYME33r2PPoiBgyA5Zsxw_6bW7Hh_5';

let _accessToken = null;

// hash에서 access_token 파싱
(function(){
  const hash = window.location.hash;
  if (hash && hash.includes('access_token=')) {
    const params = new URLSearchParams(hash.slice(1));
    const type = params.get('type');
    if (type === 'recovery') {
      _accessToken = params.get('access_token');
      history.replaceState(null, '', window.location.pathname);
    }
  }
  if (!_accessToken) {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('invalid-form').style.display = '';
  }
})();

async function doReset() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  const suc = document.getElementById('suc');
  err.classList.remove('show'); suc.classList.remove('show');

  if (!pw1 || !pw2) { err.textContent = '비밀번호를 입력해주세요.'; err.classList.add('show'); return; }
  if (pw1.length < 6) { err.textContent = '비밀번호는 6자 이상이어야 합니다.'; err.classList.add('show'); return; }
  if (pw1 !== pw2) { err.textContent = '비밀번호가 일치하지 않습니다.'; err.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = '변경 중...';
  try {
    const res = await fetch(`${SB_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': `Bearer ${_accessToken}` },
      body: JSON.stringify({ password: pw1 })
    });
    if (!res.ok) { const d = await res.json(); throw new Error(d.msg || d.message || '변경 실패'); }
    suc.textContent = '✅ 비밀번호가 변경되었습니다. 3초 후 홈으로 이동합니다.';
    suc.classList.add('show');
    document.getElementById('reset-form').querySelectorAll('input,button').forEach(el => el.disabled = true);
    setTimeout(() => { window.location.href = './index.html'; }, 3000);
  } catch(e) {
    err.textContent = e.message; err.classList.add('show');
    btn.disabled = false; btn.textContent = '비밀번호 변경';
  }
}
</script>
</body>
</html>
