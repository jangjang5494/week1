  <rect x="360" y="300" width="100" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
  <text x="410" y="325" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="white">청약</text>

  <rect x="480" y="300" width="100" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
  <text x="530" y="325" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="white">대출</text>

  <rect x="600" y="300" width="120" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
  <text x="660" y="325" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="white">주거복지</text>

