name: 공고 크롤링 & 배포

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 오전 9시 KST (UTC 00:00)
    - cron: '0 6 * * *'   # 매일 오후 3시 KST (UTC 06:00)
  workflow_dispatch:
    inputs:
      mode:
        description: '크롤링 모드'
        required: false
        default: 'normal'
        type: choice
        options: ['normal', 'catchup', 'initial']

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Run scraper (SH 공고)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "initial" ]; then
            python3 scraper.py --initial
          elif [ "$MODE" = "catchup" ]; then
            python3 scraper.py --catchup
          else
            python3 scraper.py
          fi


      - name: Remove announcements.json if exists
        run: rm -f announcements.json
