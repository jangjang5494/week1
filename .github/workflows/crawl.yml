name: 공고 크롤링 & 배포

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 오전 9시 KST (UTC 00:00)
    - cron: '0 6 * * *'   # 매일 오후 3시 KST (UTC 06:00)
  workflow_dispatch:
    inputs:
      initial:
        description: '초기 DB 구축 (2026-03-01 이후 전체 크롤링)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event.inputs.initial }}" = "true" ]; then
            python3 scraper.py --initial
          else
            python3 scraper.py
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add announcements.json
          git diff --staged --quiet || git commit -m "chore: update announcements [$(date '+%Y-%m-%d')]"
          git push
