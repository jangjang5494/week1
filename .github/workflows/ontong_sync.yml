name: 온통청년 정책 동기화

on:
  # schedule:
  #   - cron: '0 0 * * 1'   # 매주 월요일 오전 9시 KST (UTC 00:00) — 비활성화
  workflow_dispatch:
    inputs:
      force_update:
        description: '충돌 항목도 API 값으로 강제 덮어쓰기'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Sync 온통청년 API → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ONTONG_API_KEY: ${{ secrets.ONTONG_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            python3 ontong_sync.py --force-update
          else
            python3 ontong_sync.py
          fi
